[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcpdb"
version = "5.1.0"
description = "MCP server for natural language database exploration and analysis"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "sqlalchemy>=2.0",
    "mcp>=1.0",
    "langgraph>=0.2",
    "pandas>=2.0",
    "anthropic>=0.40",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "matplotlib>=3.5",
    "seaborn>=0.12",
]
sandbox = [
    "matplotlib>=3.5",
    "seaborn>=0.12",
]
postgresql = [
    "psycopg2-binary>=2.9",
]
mysql = [
    "pymysql>=1.1",
]
mssql = [
    "pyodbc>=5.0",
]
oracle = [
    "cx_Oracle>=8.0",
]
excel = [
    "openpyxl>=3.1",
]
csv = [
    "duckdb>=1.0",
    "chardet>=5.0",
]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]
export = [
    "weasyprint>=62",
    "nbformat>=5.0",
]
openai = [
    "openai>=1.0",
]
gemini = [
    "google-genai>=1.0",
]
ollama = [
    "httpx>=0.25",
]
all = [
    "mcpdb[postgresql,mysql,excel,csv,web,export,sandbox,openai,gemini,ollama]",
]

[project.scripts]
mcpdb = "mcpdb.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
